[project]
name = "athex-analyst"
version = "0.1.0"
description = "Rule-based technical/fundamental screener and buy-signal reporter for ATHEX (Χρηματιστήριο Αθηνών) large caps"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]
