name: YouTube Analyzer

# Το sandbox όπου τρέχει ο Claude agent session δεν έχει γενικά πρόσβαση στο
# YouTube/διαδίκτυο, οπότε η πραγματική λήψη/ανάλυση βίντεο δεν μπορεί να
# γίνει μέσα σε μια συνομιλία chat. Αυτό το workflow τρέχει on-demand με
# πλήρη πρόσβαση internet, φτιάχνει (ή ενημερώνει) τη βιβλιοθήκη ανάλυσης στο
# repo, και ανεβάζει την αναφορά/υπότιτλους/tab ως workflow artifacts.

on:
  workflow_dispatch:
    inputs:
      video:
        description: "YouTube URL ή video ID"
        required: true
      mode:
        description: "Λειτουργία"
        required: true
        default: "analyze"
        type: choice
        options:
          - analyze
          - subtitles
          - compare
          - tab
          - lesson
      start:
        description: "(compare/tab/lesson) αρχή αποσπάσματος, π.χ. 2:25"
        required: false
      end:
        description: "(compare/tab/lesson) τέλος αποσπάσματος, π.χ. 3:00"
        required: false
      max_related:
        description: "(μόνο lesson) πλήθος σχετικών βίντεο προς αυτόματη αναζήτηση/σύγκριση"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: youtube-analyzer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (ffmpeg για ASR/audio, tesseract-ocr για tab/lesson)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run analyze
        if: ${{ github.event.inputs.mode == 'analyze' }}
        env:
          PYTHONPATH: src
        run: python -m youtube_analyzer.cli analyze "${{ github.event.inputs.video }}"

      - name: Run subtitles
        if: ${{ github.event.inputs.mode == 'subtitles' }}
        env:
          PYTHONPATH: src
        run: python -m youtube_analyzer.cli subtitles "${{ github.event.inputs.video }}"

      - name: Run compare
        if: ${{ github.event.inputs.mode == 'compare' }}
        env:
          PYTHONPATH: src
        run: |
          python -m youtube_analyzer.cli compare "${{ github.event.inputs.video }}" \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}"

      - name: Run tab (OCR ταμπλατούρα, συγχρονισμένη με την εικόνα)
        if: ${{ github.event.inputs.mode == 'tab' }}
        env:
          PYTHONPATH: src
        run: |
          python -m youtube_analyzer.cli tab "${{ github.event.inputs.video }}" \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}"

      - name: Run lesson (OCR ταμπλατούρα + αυτόματη αναζήτηση/σύγκριση σχετικών βίντεο)
        if: ${{ github.event.inputs.mode == 'lesson' }}
        env:
          PYTHONPATH: src
        run: |
          python -m youtube_analyzer.cli lesson "${{ github.event.inputs.video }}" \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}" \
            --max-related "${{ github.event.inputs.max_related }}"

      - name: Upload reports/subtitles artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-analyzer-output
          path: reports/youtube/
          retention-days: 30

      - name: Commit library + reports to repository
        run: |
          git config user.name "youtube-analyzer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/youtube_library reports/youtube
          git diff --cached --quiet || git commit -m "chore: ενημέρωση youtube_analyzer βιβλιοθήκης/αναφορών [skip ci]"
          git push
